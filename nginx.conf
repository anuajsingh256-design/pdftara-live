server {
    listen 80;
    server_name _;

    root /website/pdftara;
    index index.html;

    # Gzip
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/wasm;

    # MIME types
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/javascript mjs;
    }

    # Security headers (COOP/COEP hata diye taaki Google ads chalein)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Static assets
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        access_log off;
    }

    # Service workers: kabhi cache nahi (purana worker hatane ke liye)
    location = /coi-serviceworker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # JS, CSS, MJS
    location ~* \.(js|css|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        access_log off;
    }

    # Next.js build assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        access_log off;
    }

    # Runtime workers
    location ^~ /workers/ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # PyMuPDF WASM assets
    location ^~ /pymupdf-wasm/ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # Locale-prefixed asset fallback
    location ~* ^/[A-Za-z-]+/(workers|pymupdf-wasm)/(.+)$ {
        rewrite ^/[A-Za-z-]+/(workers|pymupdf-wasm)/(.+)$ /$1/$2 break;
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # LibreOffice WASM files
    location ^~ /libreoffice-wasm/ {
        gzip_static always;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        types {
            application/wasm wasm;
            application/javascript js;
            application/octet-stream data;
        }
        include /etc/nginx/security-headers.conf;
    }

    # 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Core routing
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }
}
